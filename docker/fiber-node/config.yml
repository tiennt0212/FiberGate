# Pre-seeded FNN testnet config for fiber-node.
#
# Exact `config/testnet/config.yml` from nervosnetwork/fiber at tag `v0.9.0-rc6`
# (https://github.com/nervosnetwork/fiber/blob/v0.9.0-rc6/config/testnet/config.yml),
# matching the pinned image tag in docker-compose.yml — keep this ref in sync with
# that tag when bumping the image, to avoid config schema drift.
#
# Two changes from upstream, both inside the `rpc:` block below:
#   1. rpc.listening_addr is this container's static IP instead of 127.0.0.1,
#      so fibergate-core can reach it over the internal docker network.
#   2. rpc.enabled_modules is listed explicitly, to add `pubsub`.
# Everything else is byte-for-byte upstream — including the empty
# `announced_addrs` below, which is deliberately left blank here; see its own
# comment for why that value has to come from an env var instead.

# This configuration file only contains the necessary configurations for the testnet deployment.
# All options' descriptions can be found via `fnn --help` and be overridden by command line arguments or environment variables.
fiber:
  listening_addr: "/ip4/0.0.0.0/tcp/8228"
  # Node name announced to the Fiber network. It is shown in RPC responses,
  # the TUI header, and the network graph.
  # announced_node_name: "my-fiber-node"
  # Disable automatic peer reconnect backoff after disconnects.
  # enable_peer_reconnect_backoff: true
  bootnode_addrs:
    - "/ip4/54.179.226.154/tcp/8228/p2p/Qmes1EBD4yNo9Ywkfe6eRw9tG1nVNGLDmMud1xJMsoYFKy"
    - "/ip4/16.163.7.105/tcp/8228/p2p/QmdyQWjPtbK4NWWsvy8s69NGJaQULwgeQDT5ZpNDrTNaeV"
  announce_listening_addr: true
  announced_addrs:
    # DELIBERATELY EMPTY — don't fill this in. The address this node announces
    # is built in docker-compose.yml from .env's DOMAIN and handed to fnn as
    # FIBER_ANNOUNCED_ADDRS (both the plain-TCP and /wss forms). It has to work
    # that way because this file is copied verbatim into create-fibergate's
    # templates (packages/create-fibergate/scripts/copy-templates.mjs) —
    # anything hardcoded here would ship to every merchant.
    #
    # Why it matters: a node announcing no *reachable* address is rejected by
    # every peer as ProcessingError("private address node announcement"),
    # which flags it a malicious gossip peer and gets it banned — so it never
    # enters the public routing graph and can never be paid. `announce_listening_addr:
    # true` above does NOT cover for this: fnn filters the 0.0.0.0 listening
    # address back out as unreachable. See gotchas.md.
    #
    # The WSS form is announced automatically alongside the TCP one, so
    # browser/WASM wallets (apps/demo-storefront's "Pay with browser wallet")
    # need nothing switched on here — only a real TLS cert on nginx, see
    # docs/merchants/public-https-deploy.md.
  chain: testnet

  ## SOCKS5 proxy settings
  ## Uncomment to route all outbound P2P connections through a SOCKS5 proxy (e.g. Tor).
  # proxy:
  #   proxy_url: "socks5://127.0.0.1:9050"
  #   ## Use random username/password for each proxy connection to improve Tor stream isolation. [default: true]
  #   proxy_random_auth: true

  ## Tor onion hidden service settings
  ## Uncomment to make this node reachable via a .onion address.
  ## Requires a running Tor daemon with ControlPort enabled.
  # onion:
  #   listen_on_onion: false
  #   ## Tor SOCKS5 proxy url for routing .onion address connections. e.g. 127.0.0.1:9050
  #   onion_server: "127.0.0.1:9050"
  #   ## The local address that the onion service forwards traffic to.
  #   ## If not set, it is derived from listening_addr. e.g. "127.0.0.1:8228"
  #   p2p_listen_address: "127.0.0.1:8228"
  #   ## Path to store the onion service private key. [default: $BASE_DIR/fiber/onion_private_key]
  #   onion_private_key_path: ""
  #   ## Tor controller address. [default: 127.0.0.1:9051]
  #   tor_controller: "127.0.0.1:9051"
  #   ## Tor controller hashed password (if HashedControlPassword is set in torrc).
  #   tor_password: ""
  #   ## The external port exposed by the onion service. [default: 8228]
  #   onion_external_port: 8228
  #   ## Maximum time in seconds to wait for the onion service to register with Tor. [default: 5]
  #   onion_service_start_timeout: 5
  # lock script configurations related to fiber network
  # https://github.com/nervosnetwork/fiber-scripts/blob/main/deployment/testnet/migrations/2025-02-28-111246.json
  scripts:
    - name: FundingLock
      script:
        code_hash: 0x6c67887fe201ee0c7853f1682c0b77c0e6214044c156c7558269390a8afa6d7c
        hash_type: type
        args: 0x
      cell_deps:
        - type_id:
            code_hash: 0x00000000000000000000000000000000000000000000000000545950455f4944
            hash_type: type
            args: 0x3cb7c0304fe53f75bb5727e2484d0beae4bd99d979813c6fc97c3cca569f10f6
        - cell_dep:
            out_point:
              tx_hash: 0x12c569a258dd9c5bd99f632bb8314b1263b90921ba31496467580d6b79dd14a7 # ckb_auth
              index: 0x0
            dep_type: code
    - name: CommitmentLock
      script:
        code_hash: 0x740dee83f87c6f309824d8fd3fbdd3c8380ee6fc9acc90b1a748438afcdf81d8
        hash_type: type
        args: 0x
      cell_deps:
        - type_id:
            code_hash: 0x00000000000000000000000000000000000000000000000000545950455f4944
            hash_type: type
            args: 0xf7e458887495cf70dd30d1543cad47dc1dfe9d874177bf19291e4db478d5751b
        - cell_dep:
            out_point:
              tx_hash: 0x12c569a258dd9c5bd99f632bb8314b1263b90921ba31496467580d6b79dd14a7 #ckb_auth
              index: 0x0
            dep_type: code

rpc:
  # Upstream default is 127.0.0.1 (localhost-only) — overridden to this
  # container's static IP (see docker-compose.yml's fiber-node ipv4_address)
  # so sibling containers can reach it over the internal docker network.
  # NOT 0.0.0.0: fnn classifies the wildcard address as "public" and refuses
  # to bind it without rpc.biscuit_public_key configured. A fixed RFC1918
  # private IP satisfies fnn's own address check without needing biscuit
  # auth, while staying unreachable from outside the docker network (the
  # host-side port mapping in docker-compose.yml is loopback-only).
  listening_addr: "172.28.0.10:8227"
  # Phase 2 (issue #13): "pubsub" is NOT in FNN's default rpc.enabled_modules
  # (verified against crates/fiber-lib/src/rpc/config.rs at the pinned image
  # tag: DEFAULT_ENABLED_MODULES = "cch,channel,graph,payment,info,invoice,peer")
  # — without adding it here, subscribe_store_changes doesn't exist on this
  # node at all. Setting enabled_modules in config.yml REPLACES the default
  # list entirely rather than adding to it, so every default module has to be
  # re-listed alongside pubsub. watchtower is deliberately left out — this
  # image isn't built with the watchtower feature.
  enabled_modules:
    - cch
    - channel
    - graph
    - payment
    - info
    - invoice
    - peer
    - pubsub

ckb:
  rpc_url: "https://testnet.ckbapp.dev/"
  udt_whitelist:
    - name: RUSD
      script:
        code_hash: 0x1142755a044bf2ee358cba9f2da187ce928c91cd4dc8692ded0337efa677d21a
        hash_type: type
        args: 0x878fcc6f1f08d48e87bb1c3b3d5083f23f8a39c5d5c764f253b55b998526439b
      cell_deps:
        - type_id:
            code_hash: 0x00000000000000000000000000000000000000000000000000545950455f4944
            hash_type: type
            args: 0x97d30b723c0b2c66e9cb8d4d0df4ab5d7222cbb00d4a9a2055ce2e5d7f0d8b0f
      auto_accept_amount: 1000000000

services:
  - fiber
  - rpc
  - ckb
