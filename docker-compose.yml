# FiberGate self-hosted bundle. Merchant deploy: `docker compose up -d`.
# 6 services on one internal network (postgres, fiber-node, fibergate-core,
# nginx-certs-preflight, nginx, certbot) — a bare `docker compose up -d` only
# ever starts these, see below.
#
# nginx is the ONLY service that publishes genuinely public host ports (80,
# 443, 8228) — it TLS-terminates fibergate-core's dashboard/API (443) and
# fiber-node's P2P port over WSS (8228, dual-mode: also passes through plain
# TCP for regular Fiber peers). Requires DOMAIN + CERTBOT_EMAIL in .env, and
# those ports actually reachable from the internet (DNS + firewall/router
# port-forwarding) — see README.md "Public HTTPS deploy" for the full runbook,
# including the one-time manual certbot command to get a real cert (nginx
# boots with a temporary self-signed one until then, via
# nginx-certs-preflight). fibergate-core, fiber-node, and postgres all publish
# loopback-only (127.0.0.1) host ports instead, for local dev convenience
# (`pnpm dev`, `pnpm --filter web db:migrate` running on the host) and direct
# debugging — none of the three is reachable from outside the machine running
# this compose file; nginx is the sole public entry point.
# See README.md "Running the full stack" for setup steps (env file, CKB key).
#
# Also has fiber-node-payer(-preflight) — LOCAL-TESTING-ONLY extra services,
# a second Fiber node used to pay demo invoices (see README.md "Pay a demo
# invoice with a second local node"). Gated behind `profiles: [payer]` so it
# never starts as part of a merchant's plain `docker compose up -d` — only
# via `pnpm docker:payer` / `docker compose up -d fiber-node-payer`.
#
# This file currently doubles as the only real deploy path (built from
# source via fibergate-core's `build:` block below). Plan for the eventual
# public/merchant release: publish a pre-built fibergate-core image and ship
# a separate, minimal compose file that references it directly (no monorepo
# clone needed) — see decisions-log.md 2026-07-08 ("dev vs. release compose
# split"). Not built yet; this file is what merchants use for now.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Init vars for the official postgres image — see .env.example.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fibergate-net
    # Loopback-only, same reasoning as fiber-node's RPC port below: `pnpm dev`
    # and `pnpm --filter web db:migrate` run on the host (outside Docker) need
    # to reach this container, but a plain "5432:5432" would default to
    # binding 0.0.0.0 and expose Postgres to the internet on any host with a
    # public IP and no firewall. 127.0.0.1 never leaves the machine running
    # this compose file, regardless of whether that machine has a public IP.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Fails fast with a clear message if the CKB key is missing, instead of letting
  # fiber-node crash-loop on a hard-to-read Rust panic.
  fiber-node-preflight:
    image: alpine:3.20
    volumes:
      - ./docker/fiber-node:/fiber:ro
    networks:
      - fibergate-net
    command:
      - sh
      - -c
      - |
        if [ ! -f /fiber/ckb/key ]; then
          echo "============================================================"
          echo "FiberGate setup incomplete: missing CKB testnet key."
          echo ""
          echo "fiber-node needs your own CKB testnet signing key before it"
          echo "can start. Run this before 'docker compose up -d':"
          echo ""
          echo "  mkdir -p docker/fiber-node/ckb"
          echo "  # put your CKB testnet private key at docker/fiber-node/ckb/key"
          echo ""
          echo "Then set FIBER_SECRET_KEY_PASSWORD (see README.md 'Running the full stack')"
          echo "and re-run: docker compose up -d"
          echo "============================================================"
          exit 1
        fi
        echo "fiber-node-preflight OK: CKB key found at docker/fiber-node/ckb/key"

  fiber-node:
    # Pinned to a prerelease tag: nervosnetwork/fiber has not published a stable
    # Docker image tag on Docker Hub yet (only 0.9.0-rc1..rc6 and sha-<hash> exist).
    # Revisit this pin once a stable release tag is published.
    image: nervos/fiber:0.9.0-rc6
    restart: unless-stopped
    depends_on:
      fiber-node-preflight:
        condition: service_completed_successfully
    environment:
      # Password for the CKB key at docker/fiber-node/ckb/key (merchant-supplied).
      FIBER_SECRET_KEY_PASSWORD: ${FIBER_SECRET_KEY_PASSWORD}
      RUST_LOG: info
    volumes:
      # Pre-seeded config.yml, plus the merchant's ckb/key and node runtime state.
      - ./docker/fiber-node:/fiber
    networks:
      # Static IP so config.yml's rpc.listening_addr can bind to a fixed,
      # non-wildcard address. fnn refuses to bind "public" addresses (its own
      # classification, which includes the 0.0.0.0 wildcard) without
      # rpc.biscuit_public_key configured. Binding the container's own
      # RFC1918-private IP instead satisfies that check without needing
      # biscuit auth — still only reachable on this internal Docker network.
      fibergate-net:
        ipv4_address: 172.28.0.10
    # Loopback-only — reachable as localhost:8227 from the host machine itself
    # (so `pnpm dev` can reach it without a docker-compose.yml override or
    # /etc/hosts edits), but NOT bound to a public IP. This is intentionally
    # different from a normal "8227:8227" mapping, which would default to
    # 0.0.0.0 and expose fiber-node's unauthenticated RPC to the internet on
    # any host with a public IP and no firewall — the issue #3 requirement
    # ("fiber-node does NOT bind a public IP/port") is still satisfied because
    # 127.0.0.1 never leaves the machine it's running on, regardless of
    # whether that machine has a public IP.
    ports:
      - "127.0.0.1:8227:8227"
    healthcheck:
      # -u required: fnn-cli defaults to 127.0.0.1, but rpc.listening_addr is
      # now the container's static IP (172.28.0.10), not the loopback/wildcard.
      test: ["CMD", "fnn-cli", "-u", "http://172.28.0.10:8227", "info"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  fibergate-core:
    build:
      context: .
      dockerfile: docker/fibergate-core/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      fiber-node:
        condition: service_healthy
    environment:
      # See .env.example for full descriptions of each var. lib/db/ builds
      # DATABASE_URL from these 5 at runtime — same code path as local dev.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # [FIXED VALUE] Not sourced from .env — deliberately different from the 3
      # vars above. The postgres service itself has no .env-configurable
      # listening port (always 5432, the official image's own default), so
      # making this one merchant-editable without also changing the postgres
      # service would just create a mismatch. Internal-only network, no port
      # conflicts possible, so there's no real reason to change it.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      ADMIN_PASSWORD_HASH_B64: ${ADMIN_PASSWORD_HASH_B64}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET}
      FIBERGATE_INTERNAL_SECRET: ${FIBERGATE_INTERNAL_SECRET}
      FIBER_NODE_URL: ${FIBER_NODE_URL}
      FIBER_NODE_RPC_AUTH_TOKEN: ${FIBER_NODE_RPC_AUTH_TOKEN}
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
    # Loopback-only — nginx is the public entry point now (see top-of-file
    # comment and the nginx service below). A plain "3000:3000" would let
    # anyone bypass nginx and hit fibergate-core directly over plain HTTP,
    # including spoofing an X-Forwarded-Proto header to force the dashboard's
    # session cookie to look "secure" when the real connection isn't — see
    # system-design.md's cookie/X-Forwarded-Proto note. Kept (not removed
    # entirely) for direct debugging from the host itself.
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - fibergate-net
    # No curl/wget on node:20-alpine — Node 20 has a built-in fetch, so a
    # one-line `node -e` avoids adding a package just for this. /login is
    # public (no auth needed) and only renders once the auto-migrate step
    # (docker/fibergate-core/Dockerfile's CMD) has finished and the server is
    # actually listening — any non-5xx response counts as healthy.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Generates a temporary self-signed cert if a real one doesn't exist yet at
  # ${DOMAIN}'s Let's Encrypt path, so nginx can start on first boot before
  # certbot has ever issued anything (see README.md "Public HTTPS deploy" for
  # the one-time command that replaces it with a real cert). Same
  # fail-fast-with-a-clear-message spirit as fiber-node-preflight above, just
  # solving a bootstrap problem instead of a missing-file one.
  nginx-certs-preflight:
    image: alpine:3.20
    volumes:
      - certbot-conf:/etc/letsencrypt
    networks:
      - fibergate-net
    command:
      - sh
      - -c
      - |
        CERT_DIR="/etc/letsencrypt/live/${DOMAIN}"
        if [ ! -f "$$CERT_DIR/fullchain.pem" ]; then
          apk add --no-cache openssl >/dev/null
          mkdir -p "$$CERT_DIR"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "$$CERT_DIR/privkey.pem" \
            -out "$$CERT_DIR/fullchain.pem" \
            -subj "/CN=${DOMAIN}"
          echo "nginx-certs-preflight: generated a temporary self-signed cert for ${DOMAIN} so nginx can start."
          echo "Run the certbot command in README.md 'Public HTTPS deploy' to get a real one, then: docker compose exec nginx nginx -s reload"
        else
          echo "nginx-certs-preflight OK: cert already exists for ${DOMAIN}"
        fi

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      nginx-certs-preflight:
        condition: service_completed_successfully
      fibergate-core:
        condition: service_healthy
      fiber-node:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./docker/nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # '$$DOMAIN' (not '$DOMAIN'): must survive Compose's own interpolation
    # pass and reach envsubst literally, restricting substitution to ONLY
    # this var — see nginx.conf.template's own top comment for why (nginx has
    # plenty of its own runtime $variables that envsubst would otherwise eat).
    # The reload loop picks up certbot's renewals (nginx doesn't watch cert
    # files itself); not a real process supervisor, just enough for this scale.
    command:
      - sh
      - -c
      - |
        envsubst '$$DOMAIN' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
        nginx -g 'daemon off;' &
        NGINX_PID=$$!
        while true; do
          sleep 6h
          nginx -s reload
        done &
        wait $$NGINX_PID
    ports:
      - "80:80"
      - "443:443"
      - "8228:8228"
    networks:
      - fibergate-net

  # Renews the Let's Encrypt cert on a loop (initial issuance is a one-time
  # manual command — see README.md "Public HTTPS deploy" — certbot can't
  # obtain a first cert until nginx is already serving the ACME challenge
  # path on a real, publicly-reachable domain).
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $$!; done"

  # ---- Below: local-testing-only, NOT part of the merchant-facing bundle.
  # Gated behind `profiles: [payer]` — never starts via a bare
  # `docker compose up -d`, only `docker compose up -d fiber-node-payer`
  # (or `pnpm docker:payer`). See README.md "Pay a demo invoice with a
  # second local node (fiber-node-payer)". ----

  fiber-node-payer-preflight:
    profiles: [payer]
    image: alpine:3.20
    volumes:
      - ./docker/fiber-node-payer:/fiber:ro
    networks:
      - fibergate-net
    command:
      - sh
      - -c
      - |
        if [ ! -f /fiber/ckb/key ]; then
          echo "============================================================"
          echo "fiber-node-payer setup incomplete: missing CKB testnet key."
          echo ""
          echo "This is a SEPARATE key from fiber-node's own key — see"
          echo "README.md 'Pay a demo invoice with a second local node'"
          echo "for how to generate one and fund it via the testnet faucet."
          echo "============================================================"
          exit 1
        fi
        echo "fiber-node-payer-preflight OK: CKB key found at docker/fiber-node-payer/ckb/key"

  fiber-node-payer:
    profiles: [payer]
    # Same exact tag as fiber-node above — avoid any wire-protocol drift
    # between the two nodes talking to each other.
    image: nervos/fiber:0.9.0-rc6
    restart: unless-stopped
    depends_on:
      fiber-node-payer-preflight:
        condition: service_completed_successfully
    environment:
      # Password for the CKB key at docker/fiber-node-payer/ckb/key — your
      # own choice, independent of fiber-node's own FIBER_SECRET_KEY_PASSWORD.
      FIBER_SECRET_KEY_PASSWORD: ${FIBER_PAYER_SECRET_KEY_PASSWORD}
      RUST_LOG: info
    volumes:
      - ./docker/fiber-node-payer:/fiber
    networks:
      # Own static IP, distinct from fiber-node's 172.28.0.10 — same reason
      # (config.yml's rpc.listening_addr must be a fixed non-wildcard
      # address; fnn refuses to bind 0.0.0.0 without biscuit auth).
      fibergate-net:
        ipv4_address: 172.28.0.11
    # Own host port, distinct from fiber-node's 8227 — loopback-only, same
    # reasoning as fiber-node's own RPC port mapping.
    ports:
      - "127.0.0.1:8237:8227"
    healthcheck:
      test: ["CMD", "fnn-cli", "-u", "http://172.28.0.11:8227", "info"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  fibergate-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres-data:
  certbot-conf:
  certbot-www:
